<div class="card" [routerLink]="['/livro', livro.id]" [state]="{ livro: livro }">
  <img class="capa" [src]="livro.capa" [alt]="livro.titulo">

  <div class="info">
    <h2>{{ livro.titulo }}</h2>
    <span class="categoria">{{ livro.ano || 'Sem ano' }}</span>
    <p>{{ livro.autor }}</p>
  </div>
</div>
