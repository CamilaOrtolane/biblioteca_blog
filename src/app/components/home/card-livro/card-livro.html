<div class="card">
    <img src="livro.capa" alt="livro.titulo">

    <span class="categoria">{{livro.categoria}}</span>

    <h2>{{livro.titulo}}</h2>

    <p>{{livro.descricao}}</p>

    <div class="footer">
        <div class="estrelas">
            {{livro.avaliacao}}
        </div>
        <div>
            {{livro.comentarios}}
        </div>
    </div>
</div>
